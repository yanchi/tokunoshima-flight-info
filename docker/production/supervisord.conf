; nginx and php-fpm in one container. Logs go to stdout/stderr (docker logs).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
; QUIT = graceful stop: finish the requests in progress (e.g. a mail being sent).
; stopwaitsecs matches stop_grace_period in compose.prod.yml.
stopsignal=QUIT
stopwaitsecs=30
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
stopsignal=QUIT
stopwaitsecs=30
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Exit supervisord (and so the container) when a program reaches FATAL.
[eventlistener:exit-on-fatal]
command=/usr/local/bin/exit-on-fatal
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
