# nginx inside the container. The host nginx terminates TLS and proxies here,
# passing X-Forwarded-* (SYMFONY_TRUSTED_PROXIES=REMOTE_ADDR in compose.prod.yml).

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile   on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;

        charset utf-8;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Only the front controller runs PHP.
        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        # Any other .php path is not served (and not passed to PHP).
        location ~ \.php$ {
            return 404;
        }

        # Dotfiles (.env) are never served.
        location ~ /\. {
            deny all;
        }
    }
}
