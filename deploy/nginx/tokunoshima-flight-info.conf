# Host nginx vhost: /etc/nginx/sites-enabled/tokunoshima-flight-info.conf
#
#   1. Replace DOMAIN and the port (APP_PORT in .env.production)
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d DOMAIN
#      (certbot adds the 443 block and the HTTP -> HTTPS redirect)

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # certbot's HTTP-01 challenge is answered by the host, not the app.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app trusts the last hop only (SYMFONY_TRUSTED_PROXIES=REMOTE_ADDR),
        # so a client-supplied X-Forwarded-For cannot pose as another address.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
