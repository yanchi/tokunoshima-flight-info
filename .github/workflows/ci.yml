name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR は新しい push で古い実行を止める。main は止めない
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 本番イメージと同じ PHP 8.4。date.timezone は setup-php の初期値（UTC）のままにする。
      # JST の判定は ServiceDate などがコード側で Asia/Tokyo を指定しているので、ini に頼らないことを CI でも確かめる
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer check --diff

      # phpstan.dist.neon が test 環境のコンテナ情報（var/cache/test）を読むので、先にキャッシュを作る
      - name: PHPStan
        run: |
          php bin/console cache:warmup --env=test --quiet
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Lint YAML, Twig and DI container
        run: composer lint

      # マイグレーションとエンティティのマッピングがずれていないことを確かめる（テストは SchemaTool でスキーマを作るため）
      - name: Doctrine migrations and schema
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/console doctrine:schema:validate --env=test

      - name: Run PHPUnit
        run: php bin/phpunit

  # 依存パッケージの既知の脆弱性
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Audit Composer dependencies
        run: composer audit --locked

  # Starts the real production image through compose.prod.yml. PHPUnit runs
  # against the test container and cannot catch problems in this layer
  # (entrypoint, nginx permissions, environment reaching PHP). Run it on every
  # PR: whether a change affects the production setup cannot be told from the
  # changed files (docs/deploy.md).
  verify-prod:
    name: Production-equivalent smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Start the production image and check it
        run: scripts/verify-prod.sh

  # Pushes the image to GHCR on main, tagged with the commit SHA (rollback = run
  # an older SHA). Nothing is deployed from here: the VPS pulls it by hand
  # (docs/deploy.md).
  build-image:
    name: Build image and push to GHCR
    needs: [php-tests, audit, verify-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide the image name
        id: meta
        run: |
          # GHCR rejects upper case
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
