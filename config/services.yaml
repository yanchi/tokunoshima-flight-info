# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Lets the app boot from real environment variables without a .env file.
    env(CONTACT_ADDRESS): ''
    env(ODPT_CONSUMER_KEY): ''
    # Read as raw strings and validated by TimetableFreshnessPolicy, so an
    # unset or malformed value stops the timetable instead of every page
    # (docs/data-source-verification.md §7 step 7). Never use env(int:...) here.
    env(TIMETABLE_WARN_AFTER_SECONDS): ''
    env(TIMETABLE_SUSPEND_AFTER_SECONDS): ''
    # Same value as .env, so the lock works without a .env file.
    env(LOCK_DSN): 'flock'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Infrastructure/Persistence/Doctrine/Entity/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Domain\Flight\FreshnessPolicy:
        arguments:
            $maxAgeSeconds: '%env(int:FLIGHT_DATA_MAX_AGE_SECONDS)%'

    # The ODPT consumer key is part of the request URL. The framework's
    # http_client logs every URL (CurlHttpClient: 'Request: "GET <url>"'),
    # so ODPT gets its own client created without a logger (CLAUDE.md §8).
    odpt.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments: [{ max_redirects: 0 }]
        # The declared class is an interface, so autoconfiguration's
        # LoggerAware rule does not match today. Kept as a safeguard in
        # case the class is changed to a concrete client.
        autoconfigure: false

    App\Infrastructure\Provider\Odpt\OdptTimetableClient:
        arguments:
            $httpClient: '@odpt.http_client'
            $consumerKey: '%env(ODPT_CONSUMER_KEY)%'
            $logger: '@monolog.logger.timetable_sync'

    App\Domain\Flight\TimetableFreshnessPolicy:
        arguments:
            $warnAfterSeconds: '%env(TIMETABLE_WARN_AFTER_SECONDS)%'
            $suspendAfterSeconds: '%env(TIMETABLE_SUSPEND_AFTER_SECONDS)%'

    # The sync log (§7 step 7) is its own channel, written in full in prod
    # (config/packages/monolog.yaml).
    App\Application\UseCase\SyncTimetable:
        arguments:
            $logger: '@monolog.logger.timetable_sync'

    App\Infrastructure\Lock\SymfonyTimetableLock:
        arguments:
            $logger: '@monolog.logger.timetable_sync'

    App\Application\Port\TimetableProviderInterface:
        alias: App\Infrastructure\Provider\Odpt\OdptTimetableProvider

    # No data source is approved yet (CLAUDE.md §7), so the board reads from
    # a repository that never has data.
    App\Application\Port\FlightBoardRepositoryInterface:
        alias: App\Infrastructure\Persistence\NoDataFlightBoardRepository

when@test:
    services:
        # No test may reach the real API, whatever key is in the environment
        # (CLAUDE.md §9): without a key the client refuses before any request
        # (OdptTimetableClientTest). The HTTP client itself stays the
        # production one, so OdptHttpClientWiringTest still checks it.
        App\Infrastructure\Provider\Odpt\OdptTimetableClient:
            autowire: true
            arguments:
                $httpClient: '@odpt.http_client'
                $consumerKey: ''
                $logger: '@monolog.logger.timetable_sync'
        # Test-only handles, so the tests can reach these private services.
        test.odpt_timetable_client:
            alias: App\Infrastructure\Provider\Odpt\OdptTimetableClient
            public: true
        test.clock:
            alias: Psr\Clock\ClockInterface
            public: true
        test.timetable_repository:
            alias: App\Application\Port\TimetableRepositoryInterface
            public: true
