# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # A bad URL from a visitor is not a fault of the site: log it at info, below
    # the prod fingers_crossed action level, so it neither alerts nor flushes the
    # buffer (docs/data-source-verification.md §8 「エラーの画面」). 5xx keep the
    # default critical level. When a feature starts to throw another 4xx
    # (403, 422, 429...), add its exception here, or it is logged at error.
    # Never map the base HttpException: 503 and other 5xx would become info.
    exceptions:
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException:
            log_level: info
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
            log_level: info
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException:
            log_level: info

    # Contact form (docs/data-source-verification.md §8 「問い合わせフォーム」).
    # Per client: stops one person from flooding the operator. Global: stops a
    # crowd of clients from using up the mail account's sending limit.
    rate_limiter:
        contact_form:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        contact_form_global:
            policy: fixed_window
            limit: 50
            interval: '1 day'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
